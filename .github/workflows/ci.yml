# Every push and pull request: formatting, lints and tests, then drydock on a
# real SocketCAN interface (vcan0) with a bus master driving it, and the table
# of what drydock supports of Damiao's protocol, from tests/damiao.rs, on the
# run's summary page.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MUJOCO: "3.16.0"
  MUJOCO_SHA256: "139577c541d43716a63992ab698cbc7b09788b1d547fb82b682d59b40ef49b9d"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The robots' models (OpenArm's, the Microduck's), which drydock fetches
      # on its first run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/drydock/models
          key: models-${{ hashFiles('examples/*/robot.yml') }}

      # MuJoCo: the one download drydock needs, as its build error says.
      - uses: actions/cache@v6
        id: mujoco
        with:
          path: ~/.cache/drydock/mujoco-${{ env.MUJOCO }}
          key: mujoco-${{ env.MUJOCO }}
      - if: steps.mujoco.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/drydock && cd ~/.cache/drydock
          archive=mujoco-$MUJOCO-linux-x86_64.tar.gz
          curl -fLO https://github.com/google-deepmind/mujoco/releases/download/$MUJOCO/$archive
          echo "$MUJOCO_SHA256  $archive" | sha256sum -c
          tar xzf $archive && rm $archive

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: What drydock supports of each protocol
        run: |
          for protocol in "damiao:Damiao's protocol" "dynamixel:Dynamixel's Protocol 2.0 and the XL330"; do
            file=${protocol%%:*} title=${protocol#*:}
            cargo test --test $file -- --test-threads=1 2>/dev/null | awk '
              /^test .* \.\.\. / {
                name = $2; gsub("_", " ", name)
                result = substr($0, index($0, "... ") + 4)
                if (result == "ok") s = "yes"
                else if (result ~ /^ignored, /) { sub(/^ignored, /, "", result); s = result }
                else s = "**failing**"
                print "| " name " | " s " |"
              }' > rows.md
            {
              echo "## $title in drydock"
              echo
              echo "From \`tests/$file.rs\`: supported means a test shows it."
              echo
              echo "| Feature | Simulated |"
              echo "|---|---|"
              cat rows.md
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # The example arm on vcan0, driven by the example bus master for three
      # seconds: every motor must answer, enabled. Its shoulder dies at 1 s
      # for 0.5 s, and drydock must say so.
      - name: A bus master drives drydock on vcan0
        run: |
          # vcan is in linux-modules-extra on GitHub's runners, which can take
          # minutes to install: only when it isn't there already.
          sudo modprobe vcan 2>/dev/null || {
            sudo apt-get install -y -qq --no-install-recommends linux-modules-extra-$(uname -r)
            sudo modprobe vcan
          }
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72 up
          cargo build --release --bins --example wave
          printf 'faults: [{ joint: shoulder, fault: dead, at: 1 s, lasts: 500 ms }]\n' > dies.scenario.yml
          ./target/release/drydock examples/arm/robot.yml --scenario dies.scenario.yml > drydock.log 2>&1 &
          drydock=$!
          sleep 1
          ./target/release/examples/wave examples/arm/robot.yml --seconds 3 | tee wave.log
          kill $drydock && wait $drydock || true
          last=$(tail -n 1 wave.log)
          echo "$last" | grep -q silent && { echo "a motor didn't answer"; cat drydock.log; exit 1; }
          echo "$last" | grep -q '\[1\].*\[1\]' || { echo "a motor isn't enabled"; cat drydock.log; exit 1; }
          grep -q 'shoulder breaks: dead, for 0.500 s' drydock.log || { echo "no fault reported"; cat drydock.log; exit 1; }
          grep -q 'shoulder recovers from dead' drydock.log || { echo "no recovery reported"; cat drydock.log; exit 1; }

      # OpenArm's own CAN library (openarm_can, as openarm_ros2 uses it)
      # driving drydock's OpenArm through examples/openarm/hold.cpp: software
      # written for the real arm must find all eight motors and hold the
      # home pose, the elbow at a quarter turn.
      - name: OpenArm, driven by its own library
        run: |
          c=~/.cache/drydock/openarm_can-1.4.1
          git clone -q --depth 1 --branch 1.4.1 https://github.com/enactic/openarm_can $c
          g++ -std=c++17 -O2 -I $c/include examples/openarm/hold.cpp $c/src/openarm/*/*.cpp $c/src/openarm/can/socket/*.cpp \
            -o examples/openarm/hold
          ./target/release/drydock examples/openarm/robot.yml > openarm.log 2>&1 &
          drydock=$!
          timeout 300 sh -c 'until grep -q "in real time" openarm.log; do sleep 1; done' || { cat openarm.log; exit 1; }
          examples/openarm/hold 5 | tee hold.log
          kill $drydock && wait $drydock || true
          grep -q '^master ids: 0x11 0x12 0x13 0x14 0x15 0x16 0x17 0x18$' hold.log || { echo "openarm_can didn't find all eight motors"; cat openarm.log; exit 1; }
          tail -n 1 hold.log | awk '{ if ($8 < 1.45 || $8 > 1.75) { print "the elbow isn'"'"'t holding a quarter turn: " $8; exit 1 } }'

      # Pollen's servo library (rustypot 1.8.0, as the Microduck's runtime
      # uses it) driving drydock's XL330 through its serial port: it must
      # find the servo, set it up, and lift its arm level.
      - name: A Dynamixel servo, driven by Pollen's library
        run: |
          check=$RUNNER_TEMP/rustypot-check
          mkdir -p $check/src/bin
          cp examples/xl330/rustypot.rs $check/src/bin/xl330.rs
          cp examples/microduck/stand.rs $check/src/bin/microduck.rs
          printf '[package]\nname = "rustypot-check"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\nrustypot = "=1.8.0"\nserialport = { version = "4", default-features = false }\n' > $check/Cargo.toml
          cargo build --release --manifest-path $check/Cargo.toml
          ./target/release/drydock examples/xl330/robot.yml > xl330.log 2>&1 &
          drydock=$!
          timeout 60 sh -c 'until grep -q "robot.s serial port" xl330.log; do sleep 0.2; done' || { cat xl330.log; exit 1; }
          $check/target/release/xl330 /tmp/drydock-xl330 || { cat xl330.log; exit 1; }
          kill $drydock && wait $drydock || true

      # The Microduck, read as Pollen's runtime reads it each tick: fifteen
      # servos and the IMU board in one fast read. In lockstep, so it stands
      # from the first tick. Its model is fetched on first run (cached above).
      - name: The Microduck, read as Pollen's runtime reads it
        run: |
          ./target/release/drydock examples/microduck/robot.yml --lockstep 50 > microduck.log 2>&1 &
          drydock=$!
          timeout 300 sh -c 'until grep -q "robot.s serial port" microduck.log; do sleep 1; done' || { cat microduck.log; exit 1; }
          $RUNNER_TEMP/rustypot-check/target/release/microduck /tmp/microduck-tty || { cat microduck.log; exit 1; }
          kill $drydock && wait $drydock || true
